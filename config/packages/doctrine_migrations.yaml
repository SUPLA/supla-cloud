doctrine_migrations:
  enable_profiler: false
  migrations_paths:
    SuplaBundle\Migrations\Migration: '%kernel.project_dir%/migrations/mariadb'
  custom_template: '%kernel.project_dir%/migrations/migration.tpl'
  organize_migrations: BY_YEAR
  # MariaDB DDL commits implicitly; final SupLAN schema installation is nontransactional.
  all_or_nothing: false
  storage:
    table_storage:
      table_name: 'migration_versions'
  services:
    Doctrine\Migrations\Version\MigrationFactory: 'App\Migrations\Factory\MigrationFactoryDecorator'
